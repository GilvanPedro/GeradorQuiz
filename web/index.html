<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuizLab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4bdb'/%3E%3Cpath d='M9 16.5l5 5 9-11' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topo">
        <div class="topo-dentro">
            <a class="marca" href="#/">
                <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="currentColor"/>
                    <path d="M9 16.5l5 5 9-11" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>QuizLab</span>
            </a>
            <nav id="menu" class="menu" aria-label="Principal" hidden>
                <a href="#/" data-rota="/">Explorar</a>
                <a href="#/meus" data-rota="/meus">Meus quizzes</a>
                <a href="#/resultados" data-rota="/resultados">Meus resultados</a>
                <a href="#/conta" data-rota="/conta">Minha conta</a>
            </nav>
            <div id="conta" class="conta" hidden>
                <a class="botao primario" href="#/novo">Criar quiz</a>
                <a id="conta-nome" class="conta-nome" href="#/conta" title="Minha conta"></a>
                <button type="button" id="sair" class="botao discreto">Sair</button>
            </div>
        </div>
    </header>

    <p id="aviso-lento" class="aviso-lento" role="status" hidden>
        Acordando o servidor… no plano gratuito a primeira resposta pode levar até um minuto.
    </p>

    <main id="tela" class="tela"></main>

    <div id="recado" class="recado" role="status" hidden></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
